name: Android CI

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/master' }}

      - name: Repository checks
        shell: bash
        run: bash ./scripts/verify_kairos.sh

      - name: Unit tests, lint, and debug build
        shell: bash
        run: >-
          ./gradlew clean
          :app:testDebugUnitTest
          :app:lintDebug
          :app:assembleDebug
          --no-daemon
          --no-configuration-cache
          --stacktrace

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kairos-build-reports
          if-no-files-found: ignore
          path: |
            app/build/reports/**
            app/build/outputs/lint-results-debug.html
            app/build/test-results/**

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: kairos-debug-apk
          path: app/build/outputs/apk/debug/*.apk
