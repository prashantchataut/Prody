# Build and release Kairos
#
# Public test signing identity (NOT for Play Store):
#   KEYSTORE_PASSWORD=kairos-public-test
#   KEY_ALIAS=kairos
#   KEY_PASSWORD=kairos-public-test
# Keystore path: keystore/Kairos-release.jks

name: Build and release Kairos

on:
  workflow_dispatch:
  push:
    branches: ['**']
    paths-ignore:
      - '**/*.md'

permissions:
  contents: write

concurrency:
  group: kairos-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Repository checks
        shell: bash
        run: bash ./scripts/verify_kairos.sh

      - name: Unit tests and lint
        shell: bash
        run: >-
          ./gradlew
          :app:testDebugUnitTest
          :app:lintDebug
          --no-daemon
          --no-configuration-cache
          --stacktrace

      - name: Build signed release APK
        env:
          # Public test signing identity — intentionally not secret.
          KEYSTORE_PASSWORD: kairos-public-test
          KEY_ALIAS: kairos
          KEY_PASSWORD: kairos-public-test
        shell: bash
        run: >-
          ./gradlew
          :app:assembleRelease
          --no-daemon
          --no-configuration-cache
          --stacktrace

      - name: Name APK after commit
        id: package
        shell: bash
        run: |
          SHORT_SHA="${GITHUB_SHA::8}"
          APK_NAME="Kairos-${SHORT_SHA}.apk"
          cp app/build/outputs/apk/release/app-release.apk "$APK_NAME"
          echo "short_sha=$SHORT_SHA" >> "$GITHUB_OUTPUT"
          echo "apk_name=$APK_NAME" >> "$GITHUB_OUTPUT"
          sha256sum "$APK_NAME" > "$APK_NAME.sha256"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: Kairos-${{ steps.package.outputs.short_sha }}
          path: |
            ${{ steps.package.outputs.apk_name }}
            ${{ steps.package.outputs.apk_name }}.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          APK_NAME: ${{ steps.package.outputs.apk_name }}
          SHORT_SHA: ${{ steps.package.outputs.short_sha }}
        shell: bash
        run: |
          TAG="build-${SHORT_SHA}-${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" \
            "$APK_NAME" \
            "$APK_NAME.sha256" \
            --target "$GITHUB_SHA" \
            --title "Kairos ${SHORT_SHA}" \
            --notes "Automated signed Android release for commit ${GITHUB_SHA}. The included signing key is public and intended only for personal/open-source test builds."
